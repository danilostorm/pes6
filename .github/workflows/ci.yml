name: Validate STOR PES6 Web

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Validate automated PSP build scripts
        run: |
          bash -n scripts/ci/recompile_loop.sh
          bash -n scripts/port-unraid.sh
          bash -n scripts/port-unraid-inner.sh
          python3 -m py_compile scripts/ci/smoke_browser.py scripts/recover-psp-blocks.py scripts/validate-aot-seeds.py scripts/patch-psp-extra-seeds.py scripts/prepare-psp-preview.py
          python3 -m unittest discover -s test -p 'test_ci_helpers.py' -v
